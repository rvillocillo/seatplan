<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Seat - Kiid and Mai</title>
    
    <!-- Google Fonts for Elegant Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Crimson+Pro:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fcfbf9;
            --card-bg: rgba(245, 243, 238, 0.85);
            --text-dark: #2c2c2c;
            --text-muted: #666666;
            --accent-black: #0a0a0a;
            --accent-navy-blue: #1b263b;
            --border-color: #dcd6cd;
            --error-color: #a94442;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(#e2ded7 0.75px, transparent 0.75px);
            background-size: 24px 24px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* Header Styling */
        header {
            margin-bottom: 30px;
        }

        .subtitle-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .names {
            font-family: 'Alex Brush', cursive;
            font-size: 3.2rem;
            color: var(--text-dark);
            margin-bottom: 25px;
            line-height: 1.1;
        }

        .headline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dark);
            font-weight: 600;
            line-height: 1.4;
            padding: 0 10px;
        }

        /* Card Container */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 30px 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .search-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            color: var(--text-dark);
            background-color: rgba(235, 232, 226, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--text-dark);
            background-color: #ffffff;
        }

        input[type="text"]::placeholder {
            color: #9e9a93;
            font-style: italic;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--accent-black);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-family: 'Alex Brush', cursive;
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .footer-link {
            display: inline-block;
            margin-top: 15px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: var(--text-dark);
        }

        /* Result View Area */
        .result-container {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .guest-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .table-assignment {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .table-number {
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent-navy-blue);
            display: block;
            margin-top: 5px;
        }

        .map-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #fff;
            margin-bottom: 20px;
        }

        .map-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--text-dark);
            color: var(--text-dark);
            padding: 10px 24px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .btn-reset:hover {
            background: var(--text-dark);
            color: #fff;
        }

        /* Error Message */
        .error-message {
            display: none;
            color: var(--error-color);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            margin-top: 15px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <header>
            <div class="subtitle-top">The Wedding Of</div>
            <h1 class="names">Kiid and Mai</h1>
            <h2 class="headline">A Special Spot is Waiting for Our Favorite People</h2>
        </header>

        <!-- Main Interactive Card -->
        <div class="card">
            <!-- Search View -->
            <div id="searchView">
                <form class="search-form" id="seatingForm" onsubmit="event.preventDefault(); findSeat();">
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="guestNameInput" 
                            list="guestListOptions" 
                            placeholder="Enter your name" 
                            autocomplete="off" 
                            required
                        >
                        <datalist id="guestListOptions"></datalist>
                    </div>

                    <button type="submit" class="btn-submit">find your seat</button>
                </form>

                <div id="errorMessage" class="error-message">
                    We couldn't find that name on our list. Please check the spelling or ask a nearby usher for assistance!
                </div>

                <!-- Redirects directly to STAGE.png -->
                <a href="STAGE.png" target="_blank" class="footer-link">Seat Plan</a>
            </div>

            <!-- Result View -->
            <div id="resultView" class="result-container">
                <h3 class="guest-title" id="displayGuestName">Guest Name</h3>
                <div class="table-assignment">
                    You are seated at
                    <span class="table-number" id="displayTableNumber">Table X</span>
                </div>

                <div class="map-wrapper">
                    <img id="displayMapImage" src="" alt="Seating Chart Layout">
                </div>

                <button class="btn-reset" onclick="resetSearch()">Search Again</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // GUEST DATABASE
        // All guests map to STAGE.png
        // =========================================================================
        const guestDatabase = {
            "abraham bacus": { table: "Table 2", map: "STAGE.png" },
            "matt daniel gamos": { table: "Table 2", map: "STAGE.png" },
            "kim aubrey vincoy": { table: "Table 14", map: "STAGE.png" },
            "mac scelwin alpas": { table: "Table 14", map: "STAGE.png" },
            "angel sweet linao": { table: "Table 14", map: "STAGE.png" },
            "justine joyce jambangan-molina": { table: "Table 11", map: "STAGE.png" },
            "joan nardo": { table: "Table 13", map: "STAGE.png" },
            "sheila ranara": { table: "Table 13", map: "STAGE.png" },
            "jason paguidopon": { table: "Table 14", map: "STAGE.png" },
            "ana lou paguidopon": { table: "Table 14", map: "STAGE.png" }
        };

        // Populate HTML5 Datalist for Autocomplete
        document.addEventListener("DOMContentLoaded", () => {
            const datalist = document.getElementById("guestListOptions");
            Object.keys(guestDatabase).forEach(key => {
                const option = document.createElement("option");
                option.value = capitalizeWords(key);
                datalist.appendChild(option);
            });
        });

        // Search logic
        function findSeat() {
            const inputField = document.getElementById("guestNameInput");
            const errorMessage = document.getElementById("errorMessage");
            const rawInput = inputField.value;
            
            const cleanedInput = rawInput.trim().toLowerCase();

            if (guestDatabase[cleanedInput]) {
                errorMessage.style.display = "none";
                
                const guestData = guestDatabase[cleanedInput];
                document.getElementById("displayGuestName").textContent = capitalizeWords(cleanedInput);
                document.getElementById("displayTableNumber").textContent = guestData.table;
                document.getElementById("displayMapImage").src = guestData.map;

                document.getElementById("searchView").style.display = "none";
                document.getElementById("resultView").style.display = "block";
            } else {
                errorMessage.style.display = "block";
            }
        }

        // Reset back to search form
        function resetSearch() {
            document.getElementById("guestNameInput").value = "";
            document.getElementById("errorMessage").style.display = "none";
            document.getElementById("resultView").style.display = "none";
            document.getElementById("searchView").style.display = "block";
        }

        // Helper function to capitalize names
        function capitalizeWords(str) {
            return str.replace(/\b\w/g, l => l.toUpperCase());
        }
    </script>
</body>
</html>
