    <style>
        :root {
            --bg-color: #fcfbf9;
            --card-bg: rgba(245, 243, 238, 0.85);
            --text-dark: #2c2c2c;
            --text-muted: #666666;
            --accent-black: #0a0a0a;
            --accent-navy-blue: #1b263b;
            --border-color: #dcd6cd;
            --error-color: #a94442;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(#e2ded7 0.75px, transparent 0.75px);
            background-size: 24px 24px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* Header Styling */
        header {
            margin-bottom: 30px;
        }

        .subtitle-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .names {
            font-family: 'Alex Brush', cursive;
            font-size: 3.2rem;
            color: var(--text-dark);
            margin-bottom: 25px;
            line-height: 1.1;
        }

        .headline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dark);
            font-weight: 600;
            line-height: 1.4;
            padding: 0 10px;
        }

        /* Card Container */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 30px 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .search-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            color: var(--text-dark);
            background-color: rgba(235, 232, 226, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--text-dark);
            background-color: #ffffff;
        }

        input[type="text"]::placeholder {
            color: #9e9a93;
            font-style: italic;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--accent-black);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-family: 'Alex Brush', cursive;
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .footer-link {
            display: inline-block;
            margin-top: 15px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: var(--text-dark);
        }

        /* Result View Area */
        .result-container {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .guest-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .table-assignment {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .table-number {
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent-navy-blue);
            display: block;
            margin-top: 5px;
        }

        .map-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #fff;
            margin-bottom: 20px;
        }

        .map-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--text-dark);
            color: var(--text-dark);
            padding: 10px 24px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .btn-reset:hover {
            background: var(--text-dark);
            color: #fff;
        }

        /* Error Message */
        .error-message {
            display: none;
            color: var(--error-color);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            margin-top: 15px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

                <button class="btn-reset" onclick="resetSearch()">Search Again</button>

        </div>

        // Populate HTML5 Datalist for Autocomplete
        document.addEventListener("DOMContentLoaded", () => {
            const datalist = document.getElementById("guestListOptions");
            Object.keys(guestDatabase).forEach(key => {
                const option = document.createElement("option");
                option.value = capitalizeWords(key);
                datalist.appendChild(option);
            });
        });

        // Search logic
        function findSeat() {
            const inputField = document.getElementById("guestNameInput");
            const errorMessage = document.getElementById("errorMessage");
            const rawInput = inputField.value;
            
            const cleanedInput = rawInput.trim().toLowerCase();

            if (guestDatabase[cleanedInput]) {
                errorMessage.style.display = "none";
                
                const guestData = guestDatabase[cleanedInput];
                document.getElementById("displayGuestName").textContent = capitalizeWords(cleanedInput);
                document.getElementById("displayTableNumber").textContent = guestData.table;
                document.getElementById("displayMapImage").src = guestData.map;

                document.getElementById("searchView").style.display = "none";
                document.getElementById("resultView").style.display = "block";
            } else {
                errorMessage.style.display = "block";
            }
        }

        // Reset back to search form
        function resetSearch() {
            document.getElementById("guestNameInput").value = "";
            document.getElementById("errorMessage").style.display = "none";
            document.getElementById("resultView").style.display = "none";
            document.getElementById("searchView").style.display = "block";
        }

        // Helper function to capitalize names
        function capitalizeWords(str) {
            return str.replace(/\b\w/g, l => l.toUpperCase());
        }
    </script>
</body>
</html>
